[project]
name = "niko-ai"
version = "0.1.0"
description = "NIKO - Private Personal AI Assistant on Localhost"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "greenlet>=3.0.3",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.2",
    "structlog>=24.4.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.0",
    "pyjwt>=2.9.0",
    "slowapi>=0.1.9",
    "websockets>=13.0",
    "python-multipart>=0.0.9",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
windows = [
    "mss>=9.0.2",
    "pillow>=10.4.0",
    "pycaw>=20240206; sys_platform == 'win32'",
    "screen-brightness-control>=0.23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "detect-secrets>=1.5.0",
    "pytest-timeout>=2.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = ["B008", "E501", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"backend/alembic/versions/*" = ["E501", "F401"]
"backend/tests/*" = ["ARG"]
"backend/tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "slowapi.*",
    "aiosqlite.*",
    "alembic.*",
    "pycaw.*",
    "screen_brightness_control.*",
    "mss.*",
    "PIL.*",
    "psutil.*",
    "comtypes.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]
timeout = 15
filterwarnings = [
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*",
    "ignore:.*StarletteDeprecationWarning.*",
]
