<div class="absolute -top-24 -left-24 w-64 h-64 bg-primary-container/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-24 -right-24 w-64 h-64 bg-primary-container/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="flex items-center justify-between px-space-md py-space-sm bg-surface-container-high">
<div class="flex items-center space-x-space-xs">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span class="font-mono-sm text-mono-sm text-on-surface-variant uppercase tracking-wider">SYS_LOCK // NODE_01</span>
</div>
<div class="flex items-center space-x-space-xs px-2 py-0.5 rounded bg-surface-container-lowest text-primary">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container animate-ping"></span>
<span class="font-mono-sm text-mono-sm tracking-tight">Active Provider: Groq (Llama 3.3 70B)</span>
</div>
</div>
<div class="p-gutter-md flex flex-col items-center">
<div class="relative w-36 h-36 flex items-center justify-center my-space-md">
<svg class="absolute inset-0 w-full h-full animate-[spin_24s_linear_infinite]" fill="none" viewbox="0 0 144 144">
<circle cx="72" cy="72" r="68" stroke="#333538" stroke-width="1"></circle>
<circle cx="72" cy="72" r="68" stroke="#ffb020" stroke-dasharray="14 180" stroke-linecap="round" stroke-width="1.5"></circle>
</svg>
<svg class="absolute inset-0 w-full h-full animate-[spin_16s_linear_infinite_reverse]" fill="none" viewbox="0 0 144 144">
<circle cx="72" cy="72" r="52" stroke="#333538" stroke-width="1"></circle>
<circle cx="72" cy="72" r="52" stroke="#ffb020" stroke-dasharray="4 24" stroke-opacity="0.4" stroke-width="1"></circle>
<circle cx="72" cy="72" r="40" stroke="#333538" stroke-dasharray="1 8" stroke-width="1"></circle>
</svg>
<div class="relative flex items-center justify-center">
<div class="w-7 h-7 rounded-full bg-primary-container/20 animate-ping absolute"></div>
<div class="w-5 h-5 rounded-full bg-primary-container shadow-[0_0_24px_rgba(255,176,32,0.45)] flex items-center justify-center">
<div class="w-1.5 h-1.5 rounded-full bg-on-primary"></div>
</div>
</div>
</div>
<div class="flex flex-col items-center mb-space-lg text-center">
<span class="font-label-caps text-label-caps text-primary tracking-widest uppercase">NIKO_CORE v2.4.0 // STANDBY</span>
<span class="font-mono-sm text-mono-sm text-outline mt-0.5">SECURE ENCLAVE IDENT: 0x9F41C</span>
</div>
<form class="w-full flex flex-col space-y-space-md" id="auth-form" onsubmit="event.preventDefault(); handleUnlock();">
<div class="flex flex-col space-y-space-xs">
<div class="flex justify-between items-center px-0.5">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="passphrase">Master Security Key</label>
<span class="font-mono-sm text-mono-sm text-outline flex items-center space-x-1">
<span class="material-symbols-outlined text-[13px] text-outline">key</span>
<span>YUBIKEY_READY</span>
</span>
</div>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full bg-surface-container-lowest font-mono-md text-mono-md text-on-surface placeholder:text-outline-variant px-space-md py-2.5 rounded-lg focus:outline-none focus:bg-surface-container-low transition-colors duration-150" id="passphrase" onblur="this.style.outline='1px solid rgba(255, 176, 32, 0.25)'; this.style.boxShadow='none';" onfocus="this.style.outline='1px solid rgba(255, 176, 32, 0.85)'; this.style.boxShadow='0 0 16px rgba(255, 176, 32, 0.15)';" placeholder="Enter master passphrase..." style="outline: 1px solid rgba(255, 176, 32, 0.25);" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-space-md text-outline hover:text-on-surface transition-colors flex items-center justify-center p-1" onclick="toggleVisibility()" type="button">
<span class="material-symbols-outlined text-[18px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<div class="pt-space-xs flex flex-col space-y-space-sm">
<button class="w-full h-[38px] bg-primary-container hover:bg-primary-fixed-dim active:bg-on-primary-container text-on-primary font-headline-sm text-headline-sm rounded-lg flex items-center justify-center space-x-space-xs transition-all duration-100 shadow-sm" id="unlock-btn" type="submit">
<span class="material-symbols-outlined text-[18px]">lock_open</span>
<span>Unlock Niko</span>
</button>
<div class="flex items-center justify-between px-1">
<span class="font-mono-sm text-mono-sm text-outline flex items-center space-x-1">
<span class="material-symbols-outlined text-[14px]">terminal</span>
<span>[ ↵ Enter to unlock ]</span>
</span>
<button class="font-mono-sm text-mono-sm text-primary hover:text-primary-fixed flex items-center space-x-1 transition-colors" onclick="triggerHardwareKey()" type="button">
<span class="material-symbols-outlined text-[14px]">fingerprint</span>
<span>Hardware Token</span>
</button>
</div>
</div>
</form>
<div class="w-full mt-space-md hidden bg-surface-container-high rounded p-2 text-center transition-all" id="status-toast">
<span class="font-mono-sm text-mono-sm text-secondary flex items-center justify-center space-x-1" id="toast-text">
<span class="material-symbols-outlined text-[14px]">check_circle</span>
<span>CHALLENGE VERIFIED // INITIALIZING RUNTIME</span>
</span>
</div>
</div>
<div class="px-gutter-md py-space-sm bg-surface-container-lowest flex items-center justify-between">
<div class="flex items-center space-x-space-xs">
<span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
<span class="font-mono-sm text-mono-sm text-outline">Running locally · 127.0.0.1:7421</span>
</div>
<div class="flex items-center space-x-space-xs text-outline">
<span class="material-symbols-outlined text-[12px]">enhanced_encryption</span>
<span class="font-mono-sm text-mono-sm">AES-256-GCM</span>
</div>
</div>
</div>
<script>
    function toggleVisibility() {
      const input = document.getElementById('passphrase');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    function handleUnlock() {
      const input = document.getElementById('passphrase');
      const toast = document.getElementById('status-toast');
      const toastText = document.getElementById('toast-text');
      const btn = document.getElementById('unlock-btn');

      if (!input.value.trim()) {
        toast.classList.remove('hidden');
        toastText.className = 'font-mono-sm text-mono-sm text-error flex items-center justify-center space-x-1';
        toastText.innerHTML = '<span class="material-symbols-outlined text-[14px]">error</span><span>KEY REQUIRED: PASSPHRASE_EMPTY</span>';
        input.focus();
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span><span>DECRYPTING...</span>';

      setTimeout(() => {
        toast.classList.remove('hidden');
        toastText.className = 'font-mono-sm text-mono-sm text-secondary flex items-center justify-center space-x-1';
        toastText.innerHTML = '<span class="material-symbols-outlined text-[14px]">check_circle</span><span>PASSPHRASE ACCEPTED // UNLOCKING ENGINE</span>';
        btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">done</span><span>SESSION READY</span>';
      }, 700);
    }

    function triggerHardwareKey() {
      const toast = document.getElementById('status-toast');
      const toastText = document.getElementById('toast-text');
      toast.classList.remove('hidden');
      toastText.className = 'font-mono-sm text-mono-sm text-primary flex items-center justify-center space-x-1';
      toastText.innerHTML = '<span class="material-symbols-outlined text-[14px] animate-pulse">contactless</span><span>TOUCH HARDWARE SECURITY KEY NOW...</span>';
    }
  </script>
</div></main></body></html>
