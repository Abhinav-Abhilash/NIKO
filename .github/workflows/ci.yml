name: NIKO CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Type Check & Test
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Dependencies
        run: |
          uv sync --all-extras --dev

      - name: Generate Runtime Test Environment Secrets
        shell: bash
        run: |
          uv run python -c "from cryptography.fernet import Fernet; import secrets; print(f'ENCRYPTION_KEY={Fernet.generate_key().decode()}'); print(f'JWT_SECRET_KEY={secrets.token_urlsafe(48)}'); print(f'SETUP_TOKEN={secrets.token_urlsafe(24)}'); print('APP_ENV=test')" >> $GITHUB_ENV

      - name: Run Ruff Lint
        run: |
          uv run ruff check .

      - name: Run Mypy Strict Type Check
        run: |
          uv run mypy backend

      - name: Run Pytest
        run: |
          uv run pytest backend/tests -v
