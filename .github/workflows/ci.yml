name: NIKO CI/CD Pipeline

on:
  push:
    branches: [ main, "release/**" ]
  pull_request:
    branches: [ main, "release/**" ]

jobs:
  backend-quality:
    name: Backend (Ruff, Mypy, Pytest)
    runs-on: windows-latest
    env:
      APP_ENV: test
      ENCRYPTION_KEY: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY=
      JWT_SECRET_KEY: ci_test_jwt_secret_key_1234567890_abcdefghijklmnop
      SETUP_TOKEN: test_setup_token_12345

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run Ruff Lint
        run: |
          uv run ruff check .

      - name: Run Mypy Strict Type Check
        run: |
          uv run mypy backend

      - name: Run Pytest Suite
        run: |
          uv run pytest backend/tests -v

  frontend-quality:
    name: Frontend (Oxlint, Vitest & Build)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Oxlint
        run: |
          cd frontend
          npm run lint

      - name: Run Vitest Suite
        run: |
          cd frontend
          npm run test

      - name: Verify TypeScript & Vite Build
        run: |
          cd frontend
          npm run build

  tauri-shell-quality:
    name: Rust Shell (Tauri Cargo Check)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Run Cargo Check
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
